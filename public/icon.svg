<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092677" />
      <stop offset="100%" stop-color="#051442" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#af1b3f" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />
  <!-- Pareto 80/20 outer track circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="28" />
  <!-- 80% arc (Focus) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-dasharray="1005.3" stroke-dashoffset="201" transform="rotate(-90 256 256)" />
  <!-- 20% arc (Pause) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="28" stroke-linecap="round" stroke-dasharray="1005.3" stroke-dashoffset="804" transform="rotate(198 256 256)" />
  <!-- Central Pause bars with stylized energetic cut -->
  <rect x="210" y="196" width="30" height="120" rx="15" fill="#ffffff" />
  <rect x="272" y="196" width="30" height="120" rx="15" fill="url(#accentGrad)" />
</svg>
